name: ddd_practice

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 12

volumes:
  backend_vendor:
  frontend_node_modules:
  frontend_next:
